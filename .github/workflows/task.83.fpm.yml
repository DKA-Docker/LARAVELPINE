name: Action Backend CI/CD Development

on:
  push:
    branches:
      - prod
    paths:
      - '83-fpm/**'
      - '.github/workflows/task.83.fpm.yml'
  pull_request:
    branches:
      - prod
    paths:
      - '83-fpm/**'
      - '.github/workflows/task.83.fpm.yml'
env:
  APP_DIRECTORY: 83-fpm
  DOCKER_USERNAME: ${{ secrets.DKA_DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DKA_DOCKER_TOKEN }}
  DOCKER_REPO: ${{ secrets.DKA_DOCKER_REPO }}
  DOCKER_TAG: ${{ secrets.DKA_DOCKER_TAG }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Generate Docker Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest
            type=raw,value=laravel
          labels: |
            org.opencontainers.image.title=Laravel App Image Base
            org.opencontainers.image.description=Docker image for Laravel app (multi-arch)
            org.opencontainers.image.vendor=DKA Research Center
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build dan Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIRECTORY }}
          file: ./${{ env.APP_DIRECTORY }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/386,linux/arm64/v8,linux/arm/v7,linux/ppc64le
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}-laravel
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:buildcache,mode=max