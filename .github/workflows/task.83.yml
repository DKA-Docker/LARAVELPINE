name: Action Backend CI/CD 8.3

on:
  push:
    branches:
      - prod
    paths:
      - '83/**'
      - '.github/workflows/task.83.yml'
  pull_request:
    branches:
      - prod
    paths:
      - '83/**'
      - '.github/workflows/task.83.yml'

env:
  APP_DIRECTORY: 83
  DOCKER_USERNAME: ${{ secrets.DKA_DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DKA_DOCKER_TOKEN }}
  DOCKER_REPO: ${{ secrets.DKA_DOCKER_REPO }}
  DOCKER_TAG: 8.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build dan Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIRECTORY }}
          file: ./${{ env.APP_DIRECTORY }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
