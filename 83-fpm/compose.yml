name: dka-example-laravelpine
services:
  app:
    image: yovanggaanandhika/laravelpine:8.3-fpm
    container_name: dka-example-laravelpine-app
    hostname: dka-example-laravelpine-app
    restart: always
    pull_policy: always
    environment:
      APP_NAME: DKA
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:h4JBsKiwTs/2qFND2IGs7P41A9ONo+W4OuEB+jiRKDo=
      APP_URL: http://localhost
      APP_TIMEZONE: Asia/Makassar
      DB_CONNECTION: sqlite
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.80"
          memory: 128M
    ports:
      - target: 80
        published: 80
        protocol: tcp
        host_ip: 0.0.0.0
    networks:
      - default

networks:
  default:
    driver: bridge